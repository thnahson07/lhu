<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flexbox - Căn giữa toàn màn hình</title>

  <!-- Liên kết đến file CSS riêng biệt -->
  <link rel="stylesheet" href="flexbox.css">
</head>
<body>

  <!-- Thẻ .container có chiều cao toàn màn hình (100vh) và căn giữa theo 2 chiều -->
  <div class="container">
    <div class="box">
      <span class="badge">✨ Flexbox Layout</span>
      <h2>Flexbox Center</h2>
      <p>Hộp nội dung này được căn chính giữa trang web theo cả chiều dọc và ngang.</p>
    </div>
  </div>

</body>
</html>
